Name: mqueue-scheduler
Host: 0.0.0.0
Port: 3003
Mode: dev

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 4011
  Path: /metrics

#链路追踪
Telemetry:
  Name: mqueue-scheduler
  Endpoint: http://127.0.0.1:14268/api/traces
