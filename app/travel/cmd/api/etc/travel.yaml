Name: travel-api
Host: 0.0.0.0
Port: 1003
Mode: dev

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 4006
  Path: /metrics

#链路追踪
Telemetry:
  Name: travel-api
  Endpoint: http://192.168.222.19:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Log:
  ServiceName: travel-api
  Level: error

DB:
  DataSource: username:password@tcp(192.168.222.8:3306)/looklook_travel?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

Cache:
  - Host: 192.168.222.33:6379
    Pass: redis1234

#rpc
TravelRpcConf:
  Target: k8s://go-zero-looklook/travel-rpc-svc:2003

UsercenterRpcConf:
  Target: k8s://go-zero-looklook/usercenter-rpc-svc:2004
