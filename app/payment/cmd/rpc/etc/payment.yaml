Name: payment-rpc
ListenOn: 0.0.0.0:2002
Mode: dev


#监控
Prometheus:
  Host: 0.0.0.0
  Port: 4005
  Path: /metrics

#链路追踪
Telemetry:
  Name: payment-rpc
  Endpoint: http://192.168.222.19:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Log:
  ServiceName: payment-rpc
  Level: error

Redis:
  Host: 192.168.222.33:6379
  Type: node
  Pass: password
  key: payment-rpc
DB:
  DataSource: username:password@tcp(192.168.222.8:3306)/looklook_order?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
Cache:
  - Host: 192.168.222.33:6379
    Pass: password

#pay success notify order-mq for kq(kafka pub sub)
KqPaymentUpdatePayStatusConf:
  Brokers:
    - 192.168.222.18:9092
    - 192.168.222.40:9092
    - 192.168.222.11:9092
  Topic: payment-update-paystatus-topic





