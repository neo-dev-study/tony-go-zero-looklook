Log:
  ServiceName: order-rpc
  Level: error

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 4002
  Path: /metrics

#链路追踪
Telemetry:
  Name: order-rpc
  Endpoint:  http://192.168.222.19:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Redis:
  Host: 192.168.222.33:6379
  Type: node
  Pass: password
DB:
  DataSource: username:password@tcp(192.168.222.8:3306)/looklook_order?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
Cache:
  - Host: 192.168.222.33:6379
    Pass: password

#rpc
TravelRpcConf:
  Target: k8s://go-zero-looklook/travel-rpc-svc:2003

