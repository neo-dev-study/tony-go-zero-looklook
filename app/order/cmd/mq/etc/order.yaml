Name: order-mq
Host: 0.0.0.0
Port: 3001
Mode: dev

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 4003
  Path: /metrics

#链路追踪
Telemetry:
  Name: order-mq
  Endpoint: http://192.168.222.19:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Log:
  ServiceName: order-mq
  Level: error

Redis:
  Host: 192.168.222.33:6379
  Type: node
  Pass: password

#kq
PaymentUpdateStatusConf:
  Name: PaymentUpdateStatus
  Brokers:
    - 192.168.222.18:9092
    - 192.168.222.40:9092
    - 192.168.222.11:9092
  Group: payment-update-paystatus-group
  Topic: payment-update-paystatus-topic
  Offset: first
  Consumers: 1
  Processors: 1

#rpc
OrderRpcConf:
  Target: k8s://go-zero-looklook/order-rpc-svc:2001

UsercenterRpcConf:
  Target: k8s://go-zero-looklook/usercenter-rpc-svc:2004
